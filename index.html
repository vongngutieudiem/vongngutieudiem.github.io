<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vong Ngư Tiểu Điếm</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐟%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ee;--panel:#e2e9e4;--tx:#1d2b2e;--mu:#5d7073;--ac:#2f6f73;--gold:#c98a12;--bd:#c5d1cb;--fs:19px;--ff:'Noto Serif',Georgia,serif;--ui:'Be Vietnam Pro',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d22;--panel:#16282e;--tx:#dbe7e4;--mu:#8ea6a6;--ac:#7fc4bf;--gold:#e8b84a;--bd:#25393f}}
:root[data-theme="dark"]{--bg:#0f1d22;--panel:#16282e;--tx:#dbe7e4;--mu:#8ea6a6;--ac:#7fc4bf;--gold:#e8b84a;--bd:#25393f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--ui)}
body.sans{--ff:var(--ui)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:1px solid var(--bd);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:flex-end;gap:4px;max-width:720px;margin:0 auto;padding:10px 16px 0}
.top button{border:0;color:var(--mu);padding:4px 8px}
.sign{max-width:720px;margin:6px auto 0;padding:28px 16px 20px;text-align:center;cursor:pointer}
.seal{display:inline-block;border:2px solid var(--gold);color:var(--gold);font:600 15px/1.15 'Noto Serif',serif;padding:5px 6px;letter-spacing:2px;writing-mode:vertical-rl;margin-bottom:12px}
.sign h1{font:600 clamp(28px,7vw,44px)/1.15 var(--ff);margin:0;letter-spacing:.02em}
.sign p{margin:6px 0 0;color:var(--mu);font-size:14px}
.wave{display:block;width:100%;max-width:720px;margin:0 auto;height:18px;color:var(--ac);opacity:.7}
main{max-width:720px;margin:0 auto;padding:12px 16px 80px}
h2{font:600 24px/1.3 var(--ff);margin:.8em 0 .3em}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:14px 2px}
.row:hover{background:var(--panel)}
.row span:first-child{font:400 18px/1.4 var(--ff)}
.mu{color:var(--mu);font-size:14px}
.cta{background:var(--ac);color:var(--bg);border-color:var(--ac);padding:9px 16px;margin:8px 0}
.read{font:400 var(--fs)/1.9 var(--ff);max-width:62ch;margin:18px 0}
.read p{margin:0 0 1.1em}
.nav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.nav button:disabled{opacity:.35;cursor:default}
.msg{padding:40px 0;color:var(--mu);text-align:center}
@media(prefers-reduced-motion:no-preference){.fish{animation:sw 7s ease-in-out infinite alternate}}
@keyframes sw{to{transform:translateX(40px)}}
</style>
</head>
<body>
<div class="top"><button id="fm" aria-label="Giảm cỡ chữ">A−</button><button id="fp" aria-label="Tăng cỡ chữ">A+</button><button id="ft" aria-label="Đổi phông chữ">Aa</button><button id="th" aria-label="Đổi sáng tối">Sáng/Tối</button></div>
<div class="sign" id="logo"><div class="seal" aria-hidden="true">忘魚小店</div><h1>Vong Ngư Tiểu Điếm</h1><p>Tiệm nhỏ của chú cá quên</p></div>
<svg class="wave" viewBox="0 0 720 18" preserveAspectRatio="none" aria-hidden="true"><path d="M0 9 Q30 0 60 9 T120 9 T180 9 T240 9 T300 9 T360 9 T420 9 T480 9 T540 9 T600 9 T660 9 T720 9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
<main id="app"><div class="msg">Đang tải…</div></main>
<script>
// Cấu hình: thường không cần sửa. Nếu dùng tên miền riêng, điền owner và repo vào đây.
const CFG={owner:'',repo:'',dir:'truyen'};
const $=s=>document.querySelector(s),app=$('#app'),root=document.documentElement;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let fs=+LS.get('fs',19),serif=LS.get('serif','1')==='1',theme=LS.get('theme','');
function prefs(){root.style.setProperty('--fs',fs+'px');document.body.classList.toggle('sans',!serif);if(theme)root.setAttribute('data-theme',theme)}
prefs();
$('#fm').onclick=()=>{fs=Math.max(14,fs-1);LS.set('fs',fs);prefs()};
$('#fp').onclick=()=>{fs=Math.min(30,fs+1);LS.set('fs',fs);prefs()};
$('#ft').onclick=()=>{serif=!serif;LS.set('serif',serif?'1':'0');prefs()};
$('#th').onclick=()=>{const cur=root.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;theme=dark?'light':'dark';LS.set('theme',theme);prefs()};
$('#logo').onclick=()=>{location.hash=''};

function repoInfo(){let{owner,repo}=CFG;if(owner&&repo)return{owner,repo};const h=location.hostname;if(h.endsWith('.github.io')){owner=h.split('.')[0];const seg=location.pathname.split('/')[1];repo=seg&&!/\.html?$/.test(seg)?seg:h}return{owner,repo}}
async function list(path){
  const k='ls:'+path;try{const c=JSON.parse(sessionStorage.getItem(k)||'null');if(c&&Date.now()-c.t<300000)return c.d}catch(e){}
  const{owner,repo}=repoInfo();if(!owner)throw new Error('local');
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`);
  if(r.status===404)return [];
  if(!r.ok)throw new Error('api');
  const d=(await r.json()).map(x=>({name:x.name,type:x.type}));
  try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(e){}
  return d;
}
function parse(name){const base=name.replace(/\.txt$/i,'');const m=base.match(/^(\d+)\s*[-–.]\s*(.*)$/);return m?{file:name,n:+m[1],title:m[2]||'Chương '+m[1]}:{file:name,n:1e9,title:base}}
async function chapters(story){return (await list(CFG.dir+'/'+story)).filter(x=>x.type==='file'&&/\.txt$/i.test(x.name)).map(x=>parse(x.name)).sort((a,b)=>a.n-b.n||a.file.localeCompare(b.file,'vi'))}
const enc=encodeURIComponent;
let tok=0;
async function route(){
  const t=++tok;const p=location.hash.slice(1).split('/').map(decodeURIComponent);scrollTo(0,0);
  try{
    if(p[0]==='s'&&p[1])await storyPage(p[1],t);
    else if(p[0]==='c'&&p[1]&&p[2])await chapterPage(p[1],p[2],t);
    else await home(t);
  }catch(e){if(t!==tok)return;app.innerHTML='<div class="msg">'+(e.message==='local'?'Trang cần chạy trên GitHub Pages để đọc danh sách truyện.':'Không tải được dữ liệu. Thử tải lại sau ít phút.')+'</div>'}
}
async function home(t){
  const ds=(await list(CFG.dir)).filter(x=>x.type==='dir');if(t!==tok)return;
  const last=LS.get('last','');let lh='';
  if(last){try{const l=JSON.parse(last);lh=`<button class="cta" data-h="#c/${enc(l.s)}/${enc(l.f)}">Đọc tiếp: ${esc(l.s)}</button>`}catch(e){}}
  app.innerHTML='<h2>Truyện</h2>'+lh+(ds.length?ds.map(d=>`<button class="row" data-h="#s/${enc(d.name)}"><span>${esc(d.name)}</span></button>`).join(''):'<div class="msg">Tiệm chưa có truyện nào.</div>');
}
async function storyPage(s,t){
  const cs=await chapters(s);if(t!==tok)return;
  app.innerHTML=`<p><button data-h="#">Tất cả truyện</button></p><h2>${esc(s)}</h2>`+(cs.length?cs.map(c=>`<button class="row" data-h="#c/${enc(s)}/${enc(c.file)}"><span>${c.n<1e9?'Chương '+c.n+': ':''}${esc(c.title)}</span></button>`).join(''):'<div class="msg">Truyện này chưa có chương nào.</div>');
}
async function chapterPage(s,f,t){
  const [cs,r]=await Promise.all([chapters(s),fetch(`${CFG.dir}/${enc(s)}/${enc(f)}`)]);if(t!==tok)return;
  if(!r.ok){app.innerHTML='<div class="msg">Không tìm thấy chương này.</div>';return}
  const body=await r.text();if(t!==tok)return;
  const i=cs.findIndex(c=>c.file===f),c=cs[i]||parse(f),pv=cs[i-1],nx=cs[i+1];
  LS.set('last',JSON.stringify({s,f}));
  const nav=`<div class="nav"><button ${pv?`data-h="#c/${enc(s)}/${enc(pv.file)}"`:'disabled'}>Chương trước</button><button data-h="#s/${enc(s)}">Mục lục</button><button ${nx?`data-h="#c/${enc(s)}/${enc(nx.file)}"`:'disabled'}>Chương sau</button></div>`;
  app.innerHTML=`<span class="mu">${esc(s)}</span><h2>${c.n<1e9?'Chương '+c.n+': ':''}${esc(c.title)}</h2>${nav}<div class="read">${body.trim().split(/\n+/).map(x=>'<p>'+esc(x)+'</p>').join('')}</div>${nav}`;
  document.title=c.title+' · Vong Ngư Tiểu Điếm';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(b&&!b.disabled)location.hash=b.dataset.h});
addEventListener('hashchange',route);route();
</script>
</body>
</html>
